services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: thermatrace
      POSTGRES_USER: thermatrace
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - thermatrace-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermatrace -d thermatrace"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  thermatrace-postgres:
