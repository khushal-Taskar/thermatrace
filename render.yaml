services:
  - type: web
    name: thermatrace-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements-cloud.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        value: sqlite:///./data/pharmatrace.db
      - key: ADMIN_EMAIL
        value: admin@thermatrace.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://thermatrace-pharma.vercel.app,http://localhost:3100,http://127.0.0.1:3100
      - key: COOKIE_SECURE
        value: "true"
      - key: SIMULATION_INTERVAL
        value: "3"
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: MQTT_ENABLED
        value: "false"
      - key: VOICE_STORE_AUDIO
        value: "false"
